name: Windows RDP (Tailscale High Speed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Remote Desktop (RDP)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

    - name: Set RDP User Password
      run: |
        cmd /c "net user runneradmin Pass123456!@#"

    - name: Setup Tailscale
      uses: tailscale/github-action@v2
      with:
        oauth-client-id: ""
        oauth-secret: ""
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

    - name: Get Tailscale IP & Keep Alive
      run: |
        $ip = (tailscale ip -4)
        Write-Host "=========================================="
        Write-Host "🚀 HIGH SPEED RDP READY"
        Write-Host "=========================================="
        Write-Host "CONNECT IP   : $ip"
        Write-Host "USERNAME     : runneradmin"
        Write-Host "PASSWORD     : Pass123456!@#"
        Write-Host "=========================================="
        Start-Sleep -Seconds 21600
