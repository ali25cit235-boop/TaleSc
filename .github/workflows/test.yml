name: Windows RDP (Tailscale High Speed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Remote Desktop (RDP)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

    - name: Set RDP User Password
      run: |
        cmd /c "net user runneradmin Pass123456!@#"

    - name: Install & Setup Tailscale
      run: |
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale.exe"
        Start-Process -FilePath ".\tailscale.exe" -ArgumentList "/quiet" -Wait
        
        $tailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
        & $tailscalePath up --authkey=${{ secrets.TAILSCALE_AUTHKEY }}
        
        Start-Sleep -Seconds 5
        $ip = (& $tailscalePath ip -4)
        
        Write-Host "=========================================="
        Write-Host "🚀 HIGH SPEED RDP READY"
        Write-Host "=========================================="
        Write-Host "CONNECT IP   : $ip"
        Write-Host "USERNAME     : runneradmin"
        Write-Host "PASSWORD     : Pass123456!@#"
        Write-Host "=========================================="

    - name: Keep Alive
      run: |
        Start-Sleep -Seconds 21600
