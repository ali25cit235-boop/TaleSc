name: Linux RDP (Full Speed XRDP + Tailscale)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Install Desktop Environment & XRDP
      run: |
        sudo apt update
        sudo apt install -y xfce4 xfce4-goodies xrdp
        sudo adduser runner xrdp
        echo "xfce4-session" > ~/.xsession
        sudo service xrdp restart

    - name: Set RDP Password
      run: |
        echo "runner:Pass123456!@#" | sudo chpasswd

    - name: Setup Tailscale
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

    - name: Get Tailscale IP & Show Details
      run: |
        ip=$(tailscale ip -4)
        echo "=========================================="
        echo "🚀 LINUX RDP READY FOR MSTSC"
        echo "=========================================="
        echo "CONNECT IP   : $ip"
        echo "USERNAME     : runner"
        echo "PASSWORD     : Pass123456!@#"
        echo "=========================================="

    - name: Keep Alive
      run: |
        sleep 21600
